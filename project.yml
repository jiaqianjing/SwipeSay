name: SwipeSay
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "6"
    # The iOS app is versioned on its own. These are kept out of the quoted MARKETING_VERSION /
    # CURRENT_PROJECT_VERSION lines on purpose: scripts/release.sh rewrites those for the Mac app.
    SWIPESAY_IOS_VERSION: 1.0.0
    SWIPESAY_IOS_BUILD: 1
packages:
  # Shared code (prompts, providers, settings, cache, usage, vocabulary) used by every target below.
  SwipeSayKit:
    path: Packages/SwipeSayKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  SwipeSay:
    type: application
    platform: macOS
    sources:
      - path: SwipeSay
        excludes:
          - Info.plist
    dependencies:
      - package: SwipeSayKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.swipesay
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle keys (feed URL, EdDSA public key) are merged in from this file.
        INFOPLIST_FILE: SwipeSay/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwipeSay
        INFOPLIST_KEY_NSHumanReadableCopyright: "© SwipeSay"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Reading selections in other apps (Accessibility API), posting ⌘C and the local
        # OAuth callback server are not possible inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  # iPhone / iPad app for the App Store. Shares SwipeSayKit and the result views with the Mac app; everything
  # that needs macOS (Accessibility capture, global hotkeys, screen capture, Sparkle, ChatGPT sign-in) is left out.
  SwipeSayiOS:
    type: application
    platform: iOS
    sources:
      - path: SwipeSayiOS
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: SwipeSay/UI/Components/Theme.swift
      - path: SwipeSay/UI/Popup/PopupViewModel.swift
      - path: SwipeSay/UI/Popup/ResultViews.swift
      - path: SwipeSay/UI/Vocabulary/VocabularyView.swift
    dependencies:
      - package: SwipeSayKit
      - target: SwipeSayAction
      - target: SwipeSaySafari
    settings:
      base:
        PRODUCT_NAME: SwipeSay
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.swipesay.ios
        MARKETING_VERSION: $(SWIPESAY_IOS_VERSION)
        CURRENT_PROJECT_VERSION: $(SWIPESAY_IOS_BUILD)
        DEVELOPMENT_TEAM: UBS9FUBNFR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SwipeSayiOS/SwipeSayiOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Keep the iPad build off Apple silicon Macs: the Mac app is distributed separately.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SwipeSayiOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SwipeSay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # "SwipeSay 翻译" in the share sheet: translates selected text from any app, and in Safari also reads the
  # paragraph around the selection (GetSelection.js) for context.
  SwipeSayAction:
    type: app-extension
    platform: iOS
    sources:
      - path: SwipeSayAction
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: SwipeSayiOS/Shared
      - path: SwipeSay/UI/Components/Theme.swift
      - path: SwipeSay/UI/Popup/PopupViewModel.swift
      - path: SwipeSay/UI/Popup/ResultViews.swift
    dependencies:
      - package: SwipeSayKit
    settings:
      base:
        PRODUCT_NAME: SwipeSayAction
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.swipesay.ios.action
        MARKETING_VERSION: $(SWIPESAY_IOS_VERSION)
        CURRENT_PROJECT_VERSION: $(SWIPESAY_IOS_BUILD)
        DEVELOPMENT_TEAM: UBS9FUBNFR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SwipeSayAction/SwipeSayAction.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SwipeSayAction/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SwipeSay 翻译
        APPLICATION_EXTENSION_API_ONLY: YES
  # Safari web extension: select text on a web page and the translation opens right below it. content.js
  # draws the panel; SafariWebExtensionHandler / WebBridge do the work with the same pipeline as the app.
  SwipeSaySafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SwipeSaySafari
        excludes:
          - Info.plist
          - "*.entitlements"
          - Resources
      # Copied flat into the bundle root, where Safari looks for manifest.json.
      - path: SwipeSaySafari/Resources
        buildPhase: resources
      - path: SwipeSay/UI/Components/Theme.swift
      - path: SwipeSay/UI/Popup/PopupViewModel.swift
    dependencies:
      - package: SwipeSayKit
    settings:
      base:
        PRODUCT_NAME: SwipeSaySafari
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.swipesay.ios.safari
        MARKETING_VERSION: $(SWIPESAY_IOS_VERSION)
        CURRENT_PROJECT_VERSION: $(SWIPESAY_IOS_BUILD)
        DEVELOPMENT_TEAM: UBS9FUBNFR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SwipeSaySafari/SwipeSaySafari.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SwipeSaySafari/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SwipeSay 划词翻译
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  SwipeSay:
    build:
      targets:
        SwipeSay: all
  SwipeSayiOS:
    build:
      targets:
        SwipeSayiOS: all
        SwipeSayAction: all
        SwipeSaySafari: all
    run:
      config: Debug
    archive:
      config: Release
