name: SwipeSay
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SwipeSay:
    type: application
    platform: macOS
    sources:
      - SwipeSay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.swipesay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwipeSay
        INFOPLIST_KEY_NSHumanReadableCopyright: "© SwipeSay"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Reading selections in other apps (Accessibility API), posting ⌘C and the local
        # OAuth callback server are not possible inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  SwipeSay:
    build:
      targets:
        SwipeSay: all
